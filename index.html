<!DOCTYPE html>
<html>
<head>
    <title>Valentine 💖</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
            background: #fff0f5;
            overflow: hidden;
            transition: background 2s;
        }

        h1 {
            position: relative;
            z-index: 10;
        }

        #container {
            position: relative;
            height: 300px;
            margin-top: 40px;
            z-index: 10;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
            transition: 0.2s;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
        }

        .heart {
            position: fixed;
            top: -20px;
            font-size: 18px;
            color: darkred;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                top: 100vh;
                opacity: 0;
            }
        }

        #loveMessage {
            display: none;
            font-size: 32px;
            color: #b30059;
            margin-top: 40px;
            opacity: 0;
            animation: fadeIn 2s forwards;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <h1>Harsha, will you be my Valentine? 💘</h1>

    <div id="container">
        <button id="yesBtn" onclick="sayYes()">YES</button>
        <button id="noBtn" onmouseover="moveButton()">NO</button>
    </div>

    <div id="loveMessage">
        Harsha, you just made my heart smile 💖  
        <br>
        I’m really happy you said YES 😊
    </div>

    <script>
        let yesSize = 18;
        let heartInterval;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');

            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            yesSize += 8;
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding =
                (yesSize / 1.4) + 'px ' + (yesSize * 1.4) + 'px';
        }

        function startHearts() {
            heartInterval = setInterval(() => {
                const heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * window.innerWidth + "px";
                heart.style.animationDuration = (4 + Math.random() * 2) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 900);
        }

        function sayYes() {
            clearInterval(heartInterval);
            document.body.style.background =
                "linear-gradient(to bottom, #ffe6f0, #ffffff)";
            document.getElementById("loveMessage").style.display = "block";
        }

        startHearts();
    </script>

</body>
</html>
